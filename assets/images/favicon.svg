<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CHiky Party">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5ec8f0"/>
      <stop offset="100%" stop-color="#2a9fd6"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#sky)"/>
  <!-- grass -->
  <ellipse cx="32" cy="54" rx="26" ry="8" fill="#7ed957"/>
  <!-- castle base -->
  <rect x="14" y="28" width="36" height="24" rx="4" fill="#3b82f6" stroke="#fff" stroke-width="2"/>
  <!-- towers -->
  <rect x="8" y="18" width="14" height="34" rx="4" fill="#ef4444" stroke="#fff" stroke-width="2"/>
  <rect x="42" y="18" width="14" height="34" rx="4" fill="#ef4444" stroke="#fff" stroke-width="2"/>
  <!-- tower tops -->
  <circle cx="15" cy="16" r="7" fill="#ef4444" stroke="#fff" stroke-width="2"/>
  <circle cx="49" cy="16" r="7" fill="#ef4444" stroke="#fff" stroke-width="2"/>
  <!-- door / yellow panel -->
  <rect x="24" y="36" width="16" height="16" rx="3" fill="#ffc107" stroke="#fff" stroke-width="1.5"/>
  <!-- tiny flags -->
  <path d="M20 10 L20 16 L28 13 Z" fill="#ff8a1f"/>
  <path d="M44 10 L44 16 L52 13 Z" fill="#ffeb3b"/>
  <line x1="20" y1="10" x2="20" y2="18" stroke="#1a3a4a" stroke-width="1.5"/>
  <line x1="44" y1="10" x2="44" y2="18" stroke="#1a3a4a" stroke-width="1.5"/>
</svg>
